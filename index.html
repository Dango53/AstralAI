<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Chatbot - Multimodal & Markdown</title>
    <!-- MarkdownをHTMLに綺麗に変換する外部ライブラリ (marked.js) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --chat-bg: #0f172a;
            --text-color: #f8fafc;
            --user-bubble: #3b82f6;
            --ai-bubble: #334155;
            --input-bg: #1e293b;
            --border-color: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 左側サイドバー --- */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
            gap: 14px;
            transition: margin-left 0.3s ease, width 0.3s ease;
            flex-shrink: 0;
        }

        /* サイドバー閉じるアニメーション用 */
        .sidebar.closed {
            margin-left: -300px;
        }

        .sidebar-header {
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .account-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .account-section label {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .account-row {
            display: flex;
            gap: 6px;
        }

        .sidebar select, .sidebar input {
            background-color: #090d16;
            color: white;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
        }

        .used-passwords-box {
            background-color: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.8rem;
            max-height: 80px;
            overflow-y: auto;
        }

        .used-passwords-title {
            color: #f59e0b;
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.75rem;
        }

        .password-tag {
            display: inline-block;
            background-color: #334155;
            color: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            margin: 2px;
            font-family: monospace;
        }

        .new-chat-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }
        .new-chat-btn:hover { background-color: #2563eb; }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background-color: rgba(255, 255, 255, 0.03);
            transition: background-color 0.2s;
        }
        .history-item:hover { background-color: rgba(255, 255, 255, 0.08); }
        .history-item.active { background-color: #3b82f6; color: white; font-weight: bold; }

        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .sidebar-footer a { color: #38bdf8; text-decoration: none; }

        /* --- メインチャットエリア --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            height: 100vh;
            overflow: hidden;
        }

        .chat-header {
            padding: 14px 20px;
            background-color: rgba(30, 41, 59, 0.5);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        /* サイドバー開閉用トグルボタン */
        .sidebar-toggle-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .sidebar-toggle-btn:hover { background-color: #475569; }

        .chat-header select {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-break: break-word;
        }

        /* Markdown装飾スタイルの微調整 */
        .message p { margin: 0 0 8px 0; }
        .message p:last-child { margin-bottom: 0; }
        .message h1, .message h2, .message h3 { margin-top: 10px; margin-bottom: 6px; border-bottom: 1px solid #475569; }
        .message ul, .message ol { padding-left: 20px; margin: 4px 0; }
        .message code { background-color: #090d16; padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        .message pre { background-color: #090d16; padding: 10px; border-radius: 6px; overflow-x: auto; }
        .message pre code { background: none; padding: 0; }

        .message.user { background-color: var(--user-bubble); align-self: flex-end; }
        .message.ai { background-color: var(--ai-bubble); align-self: flex-start; }
        .message.error { background-color: #991b1b; color: #fca5a5; align-self: center; text-align: center; }

        .message img, .message video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        #file-preview-bar {
            padding: 6px 20px;
            background-color: #172033;
            font-size: 0.85rem;
            color: #38bdf8;
            display: none;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
        }

        #remove-file {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-input-area {
            padding: 16px 20px;
            background-color: rgba(30, 41, 59, 0.6);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-btn-label {
            background-color: #334155;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }
        .file-btn-label:hover { background-color: #475569; }

        #file-input { display: none; }

        #user-input {
            flex: 1;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        #send-btn {
            padding: 0 20px;
            height: 42px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }
        #send-btn:hover { background-color: #2563eb; }
    </style>
</head>
<body>

    <!-- 左側サイドバー -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>🔐 アカウント＆履歴</span>
        </div>

        <div class="account-section">
            <label for="account-select">ログイン中のアカウント（パスワード）</label>
            <select id="account-select"></select>

            <div class="account-row" style="margin-top: 4px;">
                <input type="password" id="new-account-input" placeholder="新パスワードを入力">
                <button id="add-account-btn" style="background:#22c55e; border:none; color:white; padding:0 10px; border-radius:6px; cursor:pointer; font-weight:bold; white-space:nowrap;">作成</button>
            </div>
        </div>

        <div class="used-passwords-box">
            <div class="used-passwords-title">🔑 登録済みパスワード一覧</div>
            <div id="used-passwords-list"></div>
        </div>

        <button class="new-chat-btn" id="new-chat-btn">＋ 新しいチャット</button>

        <div class="history-list" id="history-list"></div>

        <div class="sidebar-footer">
            <a href="setting.html">⚙️ 設定画面</a>
        </div>
    </div>

    <!-- メインチャット画面 -->
    <div class="main-content">
        <div class="chat-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <!-- サイドバー開閉用ボタン -->
                <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="サイドバー開閉">☰</button>
                <span id="current-chat-title" style="font-weight: bold; color: #e2e8f0;">新しいチャット</span>
            </div>
            <div>
                <select id="header-model-select" title="使用モデル">
                 <option value="gemini-3.5-flash-lite">Astral 3.5 Flash Lite</option>
                 <option value="gemini-3.8-flash">Astral 3.8 Flash</option>
                 <option value="gemini-2.5-flash">Astral 2.5 Flash</option>
                </select>
            </div>
        </div>
        
        <div id="chat-messages" class="chat-messages">
            <div class="message ai">こんにちは！Markdown記法が綺麗に表示されるようになりました！</div>
        </div>

        <div id="file-preview-bar">
            <span id="file-name-display">📎 ファイルが選択されています</span>
            <button id="remove-file">✕ 取消</button>
        </div>

        <div class="chat-input-area">
            <label for="file-input" class="file-btn-label" title="ファイルを選択">＋</label>
            <input type="file" id="file-input" accept="image/*,video/*,audio/*,application/pdf,text/*">

            <input type="text" id="user-input" placeholder="メッセージを入力..." autocomplete="off">
            <button id="send-btn">送信</button>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-input');
        const filePreviewBar = document.getElementById('file-preview-bar');
        const fileNameDisplay = document.getElementById('file-name-display');
        const removeFileBtn = document.getElementById('remove-file');
        const headerModelSelect = document.getElementById('header-model-select');
        
        const accountSelect = document.getElementById('account-select');
        const newAccountInput = document.getElementById('new-account-input');
        const addAccountBtn = document.getElementById('add-account-btn');
        const usedPasswordsList = document.getElementById('used-passwords-list');
        const newChatBtn = document.getElementById('new-chat-btn');
        const historyList = document.getElementById('history-list');
        const currentChatTitle = document.getElementById('current-chat-title');

        let selectedFile = null;

        // --- サイドバーの開閉切替 ---
        sidebarToggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('closed');
        });

        // --- データ管理ロジック (localStorage) ---
        function getAccounts() {
            let accounts = JSON.parse(localStorage.getItem('gemini_accounts'));
            if (!accounts || accounts.length === 0) {
                accounts = ['pass1234'];
                localStorage.setItem('gemini_accounts', JSON.stringify(accounts));
            }
            return accounts;
        }

        function getCurrentAccount() {
            let current = localStorage.getItem('gemini_current_account');
            const accounts = getAccounts();
            if (!current || !accounts.includes(current)) {
                current = accounts[0];
                localStorage.setItem('gemini_current_account', current);
            }
            return current;
        }

        function getChats(accountName) {
            const key = `gemini_chats_${accountName}`;
            let chats = JSON.parse(localStorage.getItem(key));
            if (!chats || chats.length === 0) {
                chats = [{
                    id: 'chat_' + Date.now(),
                    title: '新しいチャット',
                    messages: [{ sender: 'ai', text: 'こんにちは！このパスワード専用のチャットルームへようこそ！' }]
                }];
                localStorage.setItem(key, JSON.stringify(chats));
            }
            return chats;
        }

        function saveChats(accountName, chats) {
            localStorage.setItem(`gemini_chats_${accountName}`, JSON.stringify(chats));
        }

        function getCurrentChatId(accountName) {
            let chatId = localStorage.getItem(`gemini_current_chat_${accountName}`);
            const chats = getChats(accountName);
            if (!chatId || !chats.find(c => c.id === chatId)) {
                chatId = chats[0].id;
                localStorage.setItem(`gemini_current_chat_${accountName}`, chatId);
            }
            return chatId;
        }

        function setCurrentChatId(accountName, chatId) {
            localStorage.setItem(`gemini_current_chat_${accountName}`, chatId);
        }

        // --- UI初期化と更新 ---
        function initApp() {
            const savedModel = localStorage.getItem('gemini_model_name') || 'astral-3.5-flash-lite';
            headerModelSelect.value = savedModel;

            const accounts = getAccounts();
            const currentAccount = getCurrentAccount();

            accountSelect.innerHTML = '';
            accounts.forEach(acc => {
                const opt = document.createElement('option');
                opt.value = acc;
                opt.textContent = `🔑 ${acc}`;
                if (acc === currentAccount) opt.selected = true;
                accountSelect.appendChild(opt);
            });

            renderUsedPasswords();
            renderHistory();
            loadCurrentChatMessages();
        }

        function renderUsedPasswords() {
            const accounts = getAccounts();
            usedPasswordsList.innerHTML = '';
            accounts.forEach(acc => {
                const tag = document.createElement('span');
                tag.classList.add('password-tag');
                tag.textContent = acc;
                usedPasswordsList.appendChild(tag);
            });
        }

        function renderHistory() {
            const currentAccount = getCurrentAccount();
            const chats = getChats(currentAccount);
            const currentChatId = getCurrentChatId(currentAccount);

            historyList.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.classList.add('history-item');
                div.textContent = chat.title;
                if (chat.id === currentChatId) {
                    div.classList.add('active');
                    currentChatTitle.textContent = chat.title;
                }
                div.addEventListener('click', () => {
                    setCurrentChatId(currentAccount, chat.id);
                    renderHistory();
                    loadCurrentChatMessages();
                });
                historyList.appendChild(div);
            });
        }

        function loadCurrentChatMessages() {
            chatMessages.innerHTML = '';
            const currentAccount = getCurrentAccount();
            const chats = getChats(currentAccount);
            const currentChatId = getCurrentChatId(currentAccount);
            const chat = chats.find(c => c.id === currentChatId);

            if (chat && chat.messages) {
                chat.messages.forEach(msg => {
                    addMessageElement(msg.text, msg.sender);
                });
            }
        }

        // メッセージ表示部分 (marked.js による HTML 自動変換)
        function addMessageElement(content, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            
            if (sender === 'ai') {
                // AIの返答は Markdown を HTML に変換して表示
                messageDiv.innerHTML = marked.parse(content);
            } else {
                // ユーザー発言・エラー・HTMLを含む入力の表示
                if (content.startsWith('<img') || content.startsWith('<video') || content.startsWith('<div>')) {
                    messageDiv.innerHTML = content;
                } else {
                    messageDiv.textContent = content;
                }
            }
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        // --- イベントリスナー ---
        headerModelSelect.addEventListener('change', (e) => {
            localStorage.setItem('gemini_model_name', e.target.value);
        });

        accountSelect.addEventListener('change', (e) => {
            localStorage.setItem('gemini_current_account', e.target.value);
            renderHistory();
            loadCurrentChatMessages();
        });

        addAccountBtn.addEventListener('click', () => {
            const newPass = newAccountInput.value.trim();
            if (!newPass) return;

            const accounts = getAccounts();
            if (accounts.includes(newPass)) {
                alert(`⚠️ そのパスワード「${newPass}」はすでに使用されています！一覧から選択するか、別のパスワードを入力してください。`);
                return;
            }

            accounts.push(newPass);
            localStorage.setItem('gemini_accounts', JSON.stringify(accounts));
            localStorage.setItem('gemini_current_account', newPass);
            newAccountInput.value = '';
            initApp();
        });

        newChatBtn.addEventListener('click', () => {
            const currentAccount = getCurrentAccount();
            const chats = getChats(currentAccount);
            const newChat = {
                id: 'chat_' + Date.now(),
                title: '新しいチャット',
                messages: [{ sender: 'ai', text: '新しいチャットルームへようこそ！メッセージを入力してね。' }]
            };
            chats.unshift(newChat);
            saveChats(currentAccount, chats);
            setCurrentChatId(currentAccount, newChat.id);
            renderHistory();
            loadCurrentChatMessages();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                selectedFile = e.target.files[0];
                fileNameDisplay.textContent = `📎 ${selectedFile.name}`;
                filePreviewBar.style.display = 'flex';
            }
        });

        removeFileBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            filePreviewBar.style.display = 'none';
        });

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = (error) => reject(error);
            });
        }

        async function getGeminiResponse(userPrompt, fileObj) {
            const apiKey = localStorage.getItem('gemini_api_key');
            const modelName = headerModelSelect.value;
            const systemInstruction = localStorage.getItem('gemini_system_instruction') || '';

            if (!apiKey) {
                return { error: 'APIキーが設定されていません。「⚙️ 育成・設定画面」から登録してください。' };
            }

            const loadingDiv = addMessageElement('考え中...', 'ai');
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            
            const parts = [];
            if (fileObj) {
                try {
                    const base64Data = await convertFileToBase64(fileObj);
                    parts.push({
                        inline_data: {
                            mime_type: fileObj.type,
                            data: base64Data
                        }
                    });
                } catch (err) {
                    loadingDiv.remove();
                    return { error: 'ファイルの読み込みに失敗しました。' };
                }
            }

            if (userPrompt) {
                parts.push({ text: userPrompt });
            } else if (fileObj && !userPrompt) {
                parts.push({ text: "このファイルについて説明してください。" });
            }

            const currentAccount = getCurrentAccount();
            const chats = getChats(currentAccount);
            const currentChatId = getCurrentChatId(currentAccount);
            const chat = chats.find(c => c.id === currentChatId);

            const contentsHistory = [];
            if (chat && chat.messages) {
            chat.messages.forEach(msg => {
            // エラーメッセージ以外を履歴としてAIに教える
            if (msg.sender === 'user') {
            contentsHistory.push({ role: 'user', parts: [{ text: msg.text }] });
             } else if (msg.sender === 'ai') {
            contentsHistory.push({ role: 'model', parts: [{ text: msg.text }] });
             }
    });
}

// 今回の最後のメッセージ（ファイル付きなどの場合も考慮）を追加
contentsHistory.push({ role: 'user', parts: parts });

const payload = {
    contents: contentsHistory
};

            if (systemInstruction) {
                payload.system_instruction = { parts: [{ text: systemInstruction }] };
            }

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                loadingDiv.remove();

                if (data.error) {
                    return { error: `APIエラー: ${data.error.message}` };
                }
                if (!data.candidates || data.candidates.length === 0) {
                    return { error: 'AIからの有効な応答が得られませんでした。' };
                }

                return { text: data.candidates[0].content.parts[0].text };
            } catch (err) {
                loadingDiv.remove();
                return { error: '通信エラーが発生しました。ネットワークを確認してください。' };
            }
        }

        async function handleSend() {
            const text = userInput.value.trim();
            const currentFile = selectedFile;
            if (!text && !currentFile) return;

            let userDisplayHtml = '';
            if (currentFile) {
                if (currentFile.type.startsWith('image/')) {
                    userDisplayHtml += `<img src="${URL.createObjectURL(currentFile)}" alt="image">`;
                } else if (currentFile.type.startsWith('video/')) {
                    userDisplayHtml += `<video src="${URL.createObjectURL(currentFile)}" controls></video>`;
                } else {
                    userDisplayHtml += `<div>📎 ${currentFile.name}</div>`;
                }
            }
            if (text) {
                userDisplayHtml += `<div>${text.replace(/\n/g, '<br>')}</div>`;
            }

            addMessageElement(userDisplayHtml, 'user');

            const currentAccount = getCurrentAccount();
            const chats = getChats(currentAccount);
            const currentChatId = getCurrentChatId(currentAccount);
            const chat = chats.find(c => c.id === currentChatId);

            if (chat) {
                if (chat.title === '新しいチャット' && text) {
                    chat.title = text.length > 15 ? text.substring(0, 15) + '...' : text;
                }
                chat.messages.push({ sender: 'user', text: userDisplayHtml });
                saveChats(currentAccount, chats);
                renderHistory();
            }

            userInput.value = '';
            selectedFile = null;
            fileInput.value = '';
            filePreviewBar.style.display = 'none';

            const result = await getGeminiResponse(text, currentFile);

            if (result.error) {
                addMessageElement(result.error, 'error');
                chat.messages.push({ sender: 'error', text: result.error });
            } else {
                addMessageElement(result.text, 'ai');
                chat.messages.push({ sender: 'ai', text: result.text });
            }
            saveChats(currentAccount, chats);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        initApp();
    </script>
</body>
</html>
