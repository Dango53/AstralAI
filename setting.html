<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio - 育成・設定</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 { border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="password"], select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
        }
        select option { background-color: #1e293b; color: white; }
        textarea { height: 120px; resize: vertical; }
        button {
            padding: 12px 24px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #16a34a; }
        .nav-link {
            display: inline-block;
            margin-top: 20px;
            color: #3b82f6;
            text-decoration: none;
        }
        .message-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .success { background-color: #15803d; color: white; }
    </style>
</head>
<body>

    <h1>🤖 AI Studio - 設定画面</h1>
    
    <div class="form-group">
        <label for="model-select">1. 使用するモデルを選択</label>
        <select id="model-select">
            <option value="gemini-3.8-flash">Astral 3.8 Flash</option>
            <option value="gemini-3.5-flash-lite">Astral 3.5 Flash Lite</option>
            <option value="gemini-2.5-flash">Astral 2.5 Flash</option>
        </select>
    </div>

    <div class="form-group">
        <label for="system-instruction">2. AIの性格・役割（システム指示書）</label>
        <textarea id="system-instruction" placeholder="例: あなたは親しみやすいチャットAIです。丁寧にわかりやすく答えてください。"></textarea>
    </div>

    <button id="save-btn">設定を保存する</button>
    <div id="msg" class="message-box success">保存しました！</div>

    <br>
    <a href="index.html" class="nav-link">👉 チャット画面（index.html）へ戻る</a>

    <script>
        const modelSelect = document.getElementById('model-select');
        const instructionInput = document.getElementById('system-instruction');
        const saveBtn = document.getElementById('save-btn');
        const msg = document.getElementById('msg');

        window.addEventListener('DOMContentLoaded', () => {
            const savedModel = localStorage.getItem('gemini_model_name');
            const savedInstruction = localStorage.getItem('gemini_system_instruction');

            if (savedModel && Array.from(modelSelect.options).some(option => option.value === savedModel)) {
                modelSelect.value = savedModel;
            }
            if (savedInstruction) {
                instructionInput.value = savedInstruction;
            }
        });

        saveBtn.addEventListener('click', () => {
            const modelName = modelSelect.value;
            const instruction = instructionInput.value.trim();

            localStorage.setItem('gemini_model_name', modelName);
            localStorage.setItem('gemini_system_instruction', instruction);

            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 2000);
        });
    </script>
</body>
</html>
